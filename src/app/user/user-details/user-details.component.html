<div class="user-info">

  <input
    #flinpt
    type="file"
    accept="image/*"
    class="file-input"
    (change)="onFileSelected($event)">

  <app-avatar
    (click)="flinpt.click()"
    [size]="40"
    [user]="userInfo()"
    [editable]="true"/>

  <div class="info-block">
    <label>Email:</label>
    <p>{{userInfo()?.email}}</p>
  </div>

  <div class="info-block editable">
    <label>Name:</label>
      @if(editName()) {
          <input matInput #edit maxlength="256" placeholder="Name">
      } @else {
          <mat-icon class="editable__icon" aria-hidden="false" aria-label="edit icon" fontIcon="edit"></mat-icon>
          <p (click)="toggleEditName()">{{userInfo()?.name}}</p>
      }
  </div>
</div>
