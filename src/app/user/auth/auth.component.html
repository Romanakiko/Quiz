<div class="row flex-center flex">
  <div class="col-6 form-widget" aria-live="polite">
    <p class="description">Sign in via magic link with email</p>
    <form [formGroup]="signInOtpForm" (ngSubmit)="onSubmit()" class="form-widget">
      <div>
        <label for="email">Email</label>
        <input
          id="emailOtp"
          formControlName="email"
          class="inputField"
          type="email"
          placeholder="Your email"
        />
      </div>
      <div>
        <button type="submit" class="button block" [disabled]="loading">
          {{ loading ? 'Loading' : 'Send magic link' }}
        </button>
      </div>
    </form>
  </div>
</div>

<div class="row flex-center flex">
  <div class="col-6 form-widget" aria-live="polite">
    <p class="description">Auth with email and password</p>
    <form [formGroup]="signInForm" (ngSubmit)="onSubmit()" class="form-widget">
      <div>
        <label for="email">Email</label>
        <input
          id="email"
          formControlName="email"
          class="inputField"
          type="email"
          placeholder="Your email"
        />
      </div>
      <div>
        <label for="password">Password</label>
        <input
          id="password"
          formControlName="password"
          class="inputField"
          type="password"
          placeholder="Your pass"
        />
      </div>
      <div>
        <button type="button" class="button block" (click)="signUp()">
          {{'Sign up'}}
        </button>
        <button type="button" class="button block" (click)="signIn()">
          {{'Sign in'}}
        </button>
      </div>
    </form>
  </div>
</div>

<asl-google-signin-button type='icon' size='medium'></asl-google-signin-button>
