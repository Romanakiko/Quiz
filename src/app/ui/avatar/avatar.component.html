<div
  class="avatar"
  [style.width]="size()"
  [style.height]="size()"
  [style.font-size]="size()">
  @if (editable()) {
    <div class="avatar_edit">
      <mat-icon aria-hidden="false" aria-label="edit icon" fontIcon="edit"></mat-icon>
    </div>
  }
  @if(user()?.avatar && user()?.avatar !== '') {
    <img [src]="user()?.avatar" class="avatar_image">
  } @else {
    <span class="avatar_text">{{user()?.name && user()?.name !== '' ? user()?.name?.slice(0,1) : '?'}}</span>
  }
</div>
