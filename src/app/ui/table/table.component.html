<div class="container">
  <mat-form-field class="container-filter">
    <mat-label>Filter</mat-label>
    <input matInput (keyup)="applyFilter($event)" placeholder="Ex. Mia" #input>
  </mat-form-field>

  <div class="mat-elevation-z8 container-table">
    <table mat-table [dataSource]="dataSource" matSort>

      @for(columnName of displayedColumns(); track $index) {
        <ng-container [matColumnDef]="columnName">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> {{columnName}} </th>
          <td mat-cell *matCellDef="let row"> {{row[columnName]}} </td>
        </ng-container>
      }

      <tr mat-header-row *matHeaderRowDef="displayedColumns()"></tr>
      <tr mat-row
          *matRowDef="let row; columns: displayedColumns();"
          class="mat-row"
          (click)="rowClick.emit(row.id)"></tr>

      <!-- Row shown when there is no matching data. -->
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" colspan="4">No data matching the filter "{{input.value}}"</td>
      </tr>
    </table>
  </div>
</div>

<mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of users"></mat-paginator>
