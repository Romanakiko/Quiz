
  <!-- Main Content -->
  <main class="main-content">
    <mat-card class="question-card">
      <div class="card-header">
        <h1 class="card-title">Create a New Question</h1>
        <p class="card-subtitle">Fill in the details below to add a new question to your quiz.</p>
      </div>

      <form [formGroup]="questionForm" (ngSubmit)="onSubmit()">
        <!-- Question -->
        <div class="form-group">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Question</mat-label>
            <textarea matInput formControlName="question"
                      placeholder="What is the capital of France?"
                      class="question-textarea"></textarea>
          </mat-form-field>
        </div>

        <!-- Answer Options -->
        <div class="options-grid">
          <mat-form-field appearance="outline">
            <mat-label>Answer Option 1</mat-label>
            <input matInput formControlName="option1"
                   placeholder="e.g., Paris">
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Answer Option 2</mat-label>
            <input matInput formControlName="option2"
                   placeholder="e.g., London">
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Answer Option 3</mat-label>
            <input matInput formControlName="option3"
                   placeholder="e.g., Berlin">
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Answer Option 4</mat-label>
            <input matInput formControlName="option4"
                   placeholder="e.g., Madrid">
          </mat-form-field>
        </div>

        <!-- Correct Answer -->
        <div class="correct-answer-section">
          <h3 class="section-title">Correct Answer</h3>
          <mat-radio-group formControlName="correctAnswer" class="answer-options">
            <mat-radio-button value="1" class="answer-option">
              Option 1
            </mat-radio-button>
            <mat-radio-button value="2" class="answer-option">
              Option 2
            </mat-radio-button>
            <mat-radio-button value="3" class="answer-option">
              Option 3
            </mat-radio-button>
            <mat-radio-button value="4" class="answer-option">
              Option 4
            </mat-radio-button>
          </mat-radio-group>
        </div>

        <!-- Submit Button -->
        <div class="submit-container">
          <button mat-raised-button color="primary" type="submit" class="submit-button">
            Add Question
          </button>
        </div>
      </form>
    </mat-card>
  </main>
