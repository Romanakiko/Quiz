  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
  <style type="text/tailwindcss">
    :root {
      --primary-color: #0c77f2;
      --secondary-color: #1e293b;
      --background-color: #0f172a;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent-color: #1e293b;
    }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--background-color);
      color: var(--text-primary);
    }
    .button_primary {
      @apply bg-[var(--primary-color)] text-white py-2 px-4 rounded-md hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50;
    }
    .button_secondary {
      @apply bg-[var(--secondary-color)] text-[var(--text-primary)] py-2 px-4 rounded-md hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-slate-500 focus:ring-opacity-50;
    }
    .typography_h1 {
      @apply text-3xl font-bold text-[var(--text-primary)] mb-4;
    }
    .typography_h2 {
      @apply text-2xl font-semibold text-[var(--text-primary)] mb-2;
    }
    .typography_body {
      @apply text-base text-[var(--text-secondary)];
    }
  </style>
</head>
